name: terraform plan

# Plan only. Nothing here applies — infrastructure changes are applied by hand
# from a workstation, deliberately. Deployments are Vercel's Git integration and
# have nothing to do with this workflow.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write # OIDC, so there is no long-lived AWS key in the repo

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest

    # Pull requests from forks do not receive secrets, so the plan could only
    # fail. Skip rather than fail loudly on an outside contribution.
    if: github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - uses: hashicorp/setup-terraform@v4
        with:
          # Kept in step with required_version in infra/providers.tf.
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: validate
        run: terraform validate -no-color

      - name: plan
        env:
          # dns.tf reads the DNS targets from Vercel at plan time, so a plan
          # needs this even when only Route 53 is changing.
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          # -lock=false: a plan does not mutate state, and concurrent pull
          # requests would otherwise queue on the S3 lock for no benefit.
          terraform plan -input=false -lock=false -no-color -out=tfplan
          {
            echo '## terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
